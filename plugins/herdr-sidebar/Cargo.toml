[package]
name = "herdr-sidebar"
version = "0.11.0"
edition = "2024"
description = "VS Code-style sidebar for herdr: file explorer + source control in one pane"
license = "MIT"

[lib]
name = "herdr_sidebar"
path = "src/lib.rs"

[[bin]]
name = "herdr-sidebar"
path = "src/main.rs"

# Windowless sidecar for [[events]] hooks: GUI subsystem on Windows (never owns a
# console) talking to herdr's socket API directly — spawning console tools from a
# hook flashes a Windows Terminal window per process on Windows 11.
[[bin]]
name = "herdr-sidebar-ensure"
path = "src/bin/ensure.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Column widths for the preview pane's own line wrapping (already in the
# tree via ratatui; wrapping has to agree with how the terminal measures).
unicode-width = "0.2"
# Pure-Rust engine (regex-fancy): no oniguruma C build on Windows; bundled
# grammar/theme dumps for the file-preview syntax highlighting.
syntect = { version = "5", default-features = false, features = [
    "parsing",
    "default-themes",
    "dump-load",
    "regex-fancy",
] }
# bat's extended grammar set (TypeScript, TOML, Dockerfile, …) — syntect's
# own defaults miss those.
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
# Ripgrep's filesystem walker, compiled into the prebuilt binary so Quick Open
# honors repository ignore files without requiring an `rg` executable.
ignore = "0.4"
globset = "0.4"
regex = "1"
# OS file events (FSEvents on macOS) for passive Source Control refresh:
# idle costs ~nothing, changes surface without timer polling.
notify = "8"
ratatui-image = { version = "11.0.8", default-features = false, features = ["crossterm", "image-defaults"] }
image = "0.25"

# Native folder picker for "Change Folder" on Windows. macOS uses osascript:
# rfd's Cocoa backend aborts when called from the background thread required
# to keep the TUI heartbeat alive. Linux keeps the typed-path fallback.
[target.'cfg(windows)'.dependencies]
rfd = { version = "0.17", default-features = false }
